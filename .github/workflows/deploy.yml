name: Deploy to GitHub Pages (DISABLED — moved to Vercel)

# Hosting moved to Vercel when auth landed: the app is no longer a
# static export, so `npm run build` produces a server build (no `out/`
# directory) and this Pages pipeline would fail. Trigger is manual-only
# (`workflow_dispatch`) so it stops auto-running on push but stays
# recoverable if we ever revert to static hosting.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set these as repo variables: Settings → Secrets and variables
          # → Actions → Variables → New repository variable.
          # Leave blank to fall back to localStorage-only mode.
          NEXT_PUBLIC_FEED_API_URL: ${{ vars.FEED_API_URL }}
          NEXT_PUBLIC_FEED_CLIENT_TOKEN: ${{ vars.FEED_CLIENT_TOKEN }}
          # Optional: URL of the static-IP Fly.io proxy that fronts
          # boost.ai's Export API v4. When set, the live-demo
          # "Analyze" button becomes active and calls this host.
          # Leave blank to hide the Analyze button entirely.
          NEXT_PUBLIC_BOOST_EXPORT_URL: ${{ vars.BOOST_EXPORT_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
